    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        h1 {
            color: white;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .input-row {
                grid-template-columns: 1fr;
            }
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-calculate {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-calculate:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-clear {
            background: #f0f0f0;
            color: #333;
        }

        .btn-clear:hover {
            background: #e0e0e0;
        }

        .results {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-label {
            color: #666;
            font-weight: 600;
        }

        .result-value {
            color: #333;
            font-weight: 700;
            font-size: 18px;
        }

        .result-value.money {
            color: #27ae60;
        }

        .result-value.percent {
            color: #e74c3c;
        }

        @media (max-width: 480px) {
            .result-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 2px;
                padding: 12px 0;
            }
            .result-value {
                font-size: 17px;
            }
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 14px;
        }

        .history-table th {
            background: #f5f5f5;
            padding: 10px 8px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #ddd;
        }

        .history-table td {
            padding: 10px 8px;
            border-bottom: 1px solid #e0e0e0;
        }

        .history-table tr:hover {
            background: #f9f9f9;
        }

        @media (max-width: 640px) {
            .history-table thead {
                display: none;
            }

            .history-table, .history-table tbody, .history-table tr, .history-table td {
                display: block;
                width: 100%;
            }

            .history-table tr {
                margin-bottom: 14px;
                border: 1px solid #e0e0e0;
                border-radius: 10px;
                padding: 10px 14px;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 6px 14px;
            }

            .history-table td {
                border-bottom: none;
                padding: 3px 0;
                display: flex;
                justify-content: space-between;
                align-items: center;
                font-size: 13px;
            }

            .history-table td::before {
                content: attr(data-label);
                font-weight: 600;
                color: #777;
                font-size: 11px;
                margin-right: 6px;
            }

            .history-table td:nth-child(1),
            .history-table td:nth-child(2) {
                grid-column: 1 / -1;
                font-size: 14px;
            }

            .history-table td:nth-child(2) {
                font-weight: 700;
                border-bottom: 1px solid #eee;
                padding-bottom: 6px;
                margin-bottom: 2px;
            }

            .history-table td:last-child {
                grid-column: 1 / -1;
                justify-content: flex-end;
                margin-top: 4px;
            }
        }

        .btn-delete {
            background: #e74c3c;
            color: white;
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .btn-delete:hover {
            background: #c0392b;
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: #999;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 Donation Tracker</h1>

        <div class="card">
            <div class="success-message" id="successMsg">Entry saved successfully!</div>

            <h2 style="margin-bottom: 20px; color: #333;">Enter Cashier Data</h2>

            <div class="input-row">
                <div class="form-group">
                    <label for="cashierName">Cashier Name</label>
                    <select id="cashierName" onchange="handleCashierSelect()">
                        <option value="">Select a cashier...</option>
                        <option value="__add_new__">+ Add New Cashier</option>
                    </select>
                </div>
            </div>

            <div class="input-row">
                <div class="form-group">
                    <label for="dateStart">Start Date</label>
                    <input type="date" id="dateStart">
                </div>
                <div class="form-group">
                    <label for="dateEnd">End Date</label>
                    <input type="date" id="dateEnd">
                </div>
            </div>

            <div class="input-row">
                <div class="form-group">
                    <label for="totalTransactions">Total Transactions</label>
                    <input type="number" id="totalTransactions" placeholder="e.g., 247" min="0">
                </div>
                <div class="form-group">
                    <label for="totalDonationAmount">Total Donation Amount ($)</label>
                    <input type="number" id="totalDonationAmount" placeholder="e.g., 62.50" min="0" step="0.01">
                </div>
            </div>

            <div class="form-group">
                <label for="donationTransactions">Number of Transactions with Donations</label>
                <input type="number" id="donationTransactions" placeholder="e.g., 18" min="0">
            </div>

            <div class="button-group">
                <button class="btn-calculate" onclick="calculateAndSave()">Calculate & Save</button>
                <button class="btn-clear" onclick="clearForm()">Clear</button>
            </div>

            <div class="results" id="results" style="display: none;">
                <h3 style="margin-bottom: 15px; color: #333;">Results</h3>
                <div class="result-item">
                    <span class="result-label">Average Donation (per donation transaction)</span>
                    <span class="result-value money" id="avgPerDonation">$0.00</span>
                </div>
                <div class="result-item">
                    <span class="result-label">Average Donation (per all transactions)</span>
                    <span class="result-value money" id="avgPerAllTransactions">$0.00</span>
                </div>
                <div class="result-item">
                    <span class="result-label">Percentage of Transactions with Donations</span>
                    <span class="result-value percent" id="percentWithDonations">0%</span>
                </div>
            </div>
        </div>

        <div class="card">
            <h2 style="margin-bottom: 20px; color: #333;">📈 Summary</h2>
            <div class="form-group">
                <label for="summaryFilter">View totals for</label>
                <select id="summaryFilter" onchange="updateSummary()">
                    <option value="__all__">All Cashiers</option>
                </select>
            </div>
            <div id="summaryResults"></div>
        </div>

        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
                <h2 style="color: #333;">📊 Donation History</h2>
                <button onclick="exportToCSV()" style="flex: none; width: auto; padding: 10px 18px; background: #27ae60; color: white; font-size: 14px;">⬇️ Export to CSV</button>
            </div>
            <div id="historyContainer">
                <div class="empty-state">No data yet. Add entries above to get started!</div>
            </div>
        </div>
    </div>

    <script>
        // Set today's date as default for end date, 5 days ago for start date
        const today = new Date();
        document.getElementById('dateEnd').value = toDateInputValue(today);
        const fiveDaysAgo = new Date(today);
        fiveDaysAgo.setDate(fiveDaysAgo.getDate() - 4); // 4 days back = 5 days total (Mon-Fri)
        document.getElementById('dateStart').value = toDateInputValue(fiveDaysAgo);

        // ---- Date helpers (avoid UTC/local timezone display bugs) ----
        function parseLocalDate(dateStr) {
            const [y, m, d] = dateStr.split('-').map(Number);
            return new Date(y, m - 1, d);
        }

        function formatDateDisplay(dateStr) {
            const [y, m, d] = dateStr.split('-').map(Number);
            return `${m}/${d}/${y}`;
        }

        // Converts a JS Date object to a YYYY-MM-DD string using LOCAL calendar
        // fields (not UTC), which is what <input type="date"> needs. This avoids
        // the well-known browser quirk where .valueAsDate interprets/exports
        // dates as UTC, which can shift the displayed default date by a day
        // depending on timezone and time of day.
        function toDateInputValue(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function rangesOverlap(startA, endA, startB, endB) {
            return parseLocalDate(startA) <= parseLocalDate(endB) && parseLocalDate(startB) <= parseLocalDate(endA);
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ---- Cashier list management ----
        function getCashierList() {
            return JSON.parse(localStorage.getItem('cashierList') || '[]');
        }

        function saveCashierList(list) {
            localStorage.setItem('cashierList', JSON.stringify(list));
        }

        function populateCashierDropdown() {
            let list = getCashierList();
            // Migrate names from any existing history entries the first time
            if (list.length === 0) {
                const history = JSON.parse(localStorage.getItem('donationHistory') || '[]');
                const names = [...new Set(history.map(e => e.cashierName))].filter(Boolean);
                if (names.length > 0) {
                    list = names.sort();
                    saveCashierList(list);
                }
            }
            const select = document.getElementById('cashierName');
            const currentValue = select.value;
            select.innerHTML = '<option value="">Select a cashier...</option>' +
                list.map(name => `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`).join('') +
                '<option value="__add_new__">+ Add New Cashier</option>';
            if (list.includes(currentValue)) select.value = currentValue;
        }

        function handleCashierSelect() {
            const select = document.getElementById('cashierName');
            if (select.value === '__add_new__') {
                const name = prompt('Enter new cashier name:');
                if (name && name.trim()) {
                    const trimmed = name.trim();
                    let list = getCashierList();
                    if (!list.some(n => n.toLowerCase() === trimmed.toLowerCase())) {
                        list.push(trimmed);
                        list.sort();
                        saveCashierList(list);
                    }
                    populateCashierDropdown();
                    select.value = trimmed;
                } else {
                    select.value = '';
                }
            }
        }

        // ---- Summary filter dropdown ----
        function populateSummaryFilterDropdown() {
            const history = JSON.parse(localStorage.getItem('donationHistory') || '[]');
            const names = [...new Set(history.map(e => e.cashierName))].sort();
            const select = document.getElementById('summaryFilter');
            const currentValue = select.value || '__all__';
            select.innerHTML = '<option value="__all__">All Cashiers</option>' +
                names.map(name => `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`).join('');
            select.value = (names.includes(currentValue) || currentValue === '__all__') ? currentValue : '__all__';
        }

        function updateSummary() {
            const filter = document.getElementById('summaryFilter').value;
            const history = JSON.parse(localStorage.getItem('donationHistory') || '[]');
            const filtered = filter === '__all__' ? history : history.filter(e => e.cashierName === filter);

            const container = document.getElementById('summaryResults');
            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state">No data yet for this selection.</div>';
                return;
            }

            // Sum raw totals first, then derive averages/percentages from the sums
            // (this is the mathematically correct way to combine multiple entries -
            // averaging the individual entries' percentages would skew results if
            // entries cover different-sized date ranges)
            const totalTransactions = filtered.reduce((sum, e) => sum + Number(e.totalTransactions), 0);
            const totalDonationAmount = filtered.reduce((sum, e) => sum + Number(e.totalDonationAmount), 0);
            const totalDonationTransactions = filtered.reduce((sum, e) => sum + Number(e.donationTransactions), 0);

            const avgPerDonation = totalDonationTransactions > 0 ? totalDonationAmount / totalDonationTransactions : 0;
            const avgPerAllTransactions = totalTransactions > 0 ? totalDonationAmount / totalTransactions : 0;
            const percentWithDonations = totalTransactions > 0 ? (totalDonationTransactions / totalTransactions) * 100 : 0;

            container.innerHTML = `
                <div class="result-item">
                    <span class="result-label">Total Transactions</span>
                    <span class="result-value">${totalTransactions}</span>
                </div>
                <div class="result-item">
                    <span class="result-label">Total Donation Amount</span>
                    <span class="result-value money">$${totalDonationAmount.toFixed(2)}</span>
                </div>
                <div class="result-item">
                    <span class="result-label">Transactions with Donations</span>
                    <span class="result-value">${totalDonationTransactions}</span>
                </div>
                <div class="result-item">
                    <span class="result-label">Average Donation (per donation transaction)</span>
                    <span class="result-value money">$${avgPerDonation.toFixed(2)}</span>
                </div>
                <div class="result-item">
                    <span class="result-label">Average Donation (per all transactions)</span>
                    <span class="result-value money">$${avgPerAllTransactions.toFixed(2)}</span>
                </div>
                <div class="result-item">
                    <span class="result-label">Percentage of Transactions with Donations</span>
                    <span class="result-value percent">${percentWithDonations.toFixed(1)}%</span>
                </div>
            `;
        }

        function calculateAndSave() {
            const cashierName = document.getElementById('cashierName').value;
            const dateStart = document.getElementById('dateStart').value;
            const dateEnd = document.getElementById('dateEnd').value;
            const totalTransactions = parseFloat(document.getElementById('totalTransactions').value);
            const totalDonationAmount = parseFloat(document.getElementById('totalDonationAmount').value);
            const donationTransactions = parseFloat(document.getElementById('donationTransactions').value);

            // Validation
            if (!cashierName || cashierName === '__add_new__') {
                alert('Please select a cashier');
                return;
            }

            if (!dateStart || !dateEnd || isNaN(totalTransactions) || isNaN(totalDonationAmount) || isNaN(donationTransactions)) {
                alert('Please fill in all fields with valid numbers');
                return;
            }

            if (parseLocalDate(dateStart) > parseLocalDate(dateEnd)) {
                alert('Start date must be before end date');
                return;
            }

            if (totalTransactions <= 0) {
                alert('Total transactions must be greater than 0');
                return;
            }

            if (donationTransactions > totalTransactions) {
                alert('Donation transactions cannot exceed total transactions');
                return;
            }

            if (donationTransactions === 0) {
                alert('Number of donation transactions must be greater than 0');
                return;
            }

            // Check for overlapping entries for the same cashier
            const existingHistory = JSON.parse(localStorage.getItem('donationHistory') || '[]');
            const overlapping = existingHistory.find(e =>
                e.cashierName === cashierName && rangesOverlap(dateStart, dateEnd, e.dateStart, e.dateEnd)
            );
            if (overlapping) {
                const proceed = confirm(
                    `This overlaps with an existing entry for ${cashierName} ` +
                    `(${formatDateDisplay(overlapping.dateStart)} – ${formatDateDisplay(overlapping.dateEnd)}). ` +
                    `Save anyway?`
                );
                if (!proceed) return;
            }

            // Calculate metrics
            const avgPerDonation = totalDonationAmount / donationTransactions;
            const avgPerAllTransactions = totalDonationAmount / totalTransactions;
            const percentWithDonations = (donationTransactions / totalTransactions) * 100;

            // Display results
            document.getElementById('avgPerDonation').textContent = '$' + avgPerDonation.toFixed(2);
            document.getElementById('avgPerAllTransactions').textContent = '$' + avgPerAllTransactions.toFixed(2);
            document.getElementById('percentWithDonations').textContent = percentWithDonations.toFixed(1) + '%';
            document.getElementById('results').style.display = 'block';

            // Save to history
            const entry = {
                id: Date.now(),
                cashierName,
                dateStart,
                dateEnd,
                totalTransactions,
                totalDonationAmount,
                donationTransactions,
                avgPerDonation: avgPerDonation.toFixed(2),
                avgPerAllTransactions: avgPerAllTransactions.toFixed(2),
                percentWithDonations: percentWithDonations.toFixed(1)
            };

            existingHistory.unshift(entry);
            localStorage.setItem('donationHistory', JSON.stringify(existingHistory));

            // Show success message
            const msg = document.getElementById('successMsg');
            msg.classList.add('show');
            setTimeout(() => msg.classList.remove('show'), 3000);

            // Refresh history, summary dropdown, and summary display
            displayHistory();
            populateSummaryFilterDropdown();
            updateSummary();

            // Clear form
            clearForm();
        }

        function clearForm() {
            document.getElementById('cashierName').value = '';
            const today = new Date();
            document.getElementById('dateEnd').value = toDateInputValue(today);
            const fiveDaysAgo = new Date(today);
            fiveDaysAgo.setDate(fiveDaysAgo.getDate() - 4);
            document.getElementById('dateStart').value = toDateInputValue(fiveDaysAgo);
            document.getElementById('totalTransactions').value = '';
            document.getElementById('totalDonationAmount').value = '';
            document.getElementById('donationTransactions').value = '';
            document.getElementById('results').style.display = 'none';
        }

        function displayHistory() {
            const history = JSON.parse(localStorage.getItem('donationHistory') || '[]');
            const container = document.getElementById('historyContainer');

            if (history.length === 0) {
                container.innerHTML = '<div class="empty-state">No data yet. Add entries above to get started!</div>';
                return;
            }

            let html = `
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>Cashier</th>
                            <th>Date Range</th>
                            <th>Transactions</th>
                            <th>Total Donations</th>
                            <th>Avg per Donation</th>
                            <th>% with Donations</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            history.forEach(entry => {
                const startDate = formatDateDisplay(entry.dateStart);
                const endDate = formatDateDisplay(entry.dateEnd);
                const dateRange = startDate === endDate ? startDate : `${startDate} – ${endDate}`;
                html += `
                    <tr>
                        <td data-label="Cashier">${entry.cashierName}</td>
                        <td data-label="Dates">${dateRange}</td>
                        <td data-label="Transactions">${entry.totalTransactions}</td>
                        <td data-label="Total Donations">$${entry.totalDonationAmount.toFixed(2)}</td>
                        <td data-label="Avg/Donation">$${entry.avgPerDonation}</td>
                        <td data-label="% w/ Donations">${entry.percentWithDonations}%</td>
                        <td><button class="btn-delete" onclick="deleteEntry(${entry.id})">Delete</button></td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function exportToCSV() {
            const history = JSON.parse(localStorage.getItem('donationHistory') || '[]');

            if (history.length === 0) {
                alert('No data to export yet!');
                return;
            }

            const headers = ['Start Date', 'End Date', 'Cashier', 'Total Transactions', 'Total Donation Amount', 'Transactions with Donations', 'Avg per Donation', 'Avg per All Transactions', 'Percent with Donations'];

            const rows = history.map(entry => [
                entry.dateStart,
                entry.dateEnd,
                entry.cashierName,
                entry.totalTransactions,
                entry.totalDonationAmount.toFixed(2),
                entry.donationTransactions,
                entry.avgPerDonation,
                entry.avgPerAllTransactions,
                entry.percentWithDonations
            ]);

            let csvContent = headers.join(',') + '\n';
            rows.forEach(row => {
                csvContent += row.map(field => `"${field}"`).join(',') + '\n';
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.setAttribute('href', url);
            const today = new Date().toISOString().split('T')[0];
            link.setAttribute('download', `donation-tracker-export-${today}.csv`);
            link.style.display = 'none';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function deleteEntry(id) {
            if (confirm('Delete this entry?')) {
                let history = JSON.parse(localStorage.getItem('donationHistory') || '[]');
                history = history.filter(entry => entry.id !== id);
                localStorage.setItem('donationHistory', JSON.stringify(history));
                displayHistory();
                populateSummaryFilterDropdown();
                updateSummary();
            }
        }

        // Initialize on page load
        populateCashierDropdown();
        populateSummaryFilterDropdown();
        displayHistory();
        updateSummary();
    </script>
</body>
</html>
