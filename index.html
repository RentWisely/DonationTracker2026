<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donation Data Tracker</title>
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/rentwisely/DonationTracker2026/main/icon.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        h1 {
            color: white;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .input-row {
                grid-template-columns: 1fr;
            }
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-calculate {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-calculate:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-clear {
            background: #f0f0f0;
            color: #333;
        }

        .btn-clear:hover {
            background: #e0e0e0;
        }

        .results {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-label {
            color: #666;
            font-weight: 600;
        }

        .result-value {
            color: #333;
            font-weight: 700;
            font-size: 18px;
        }

        .result-value.money {
            color: #27ae60;
        }

        .result-value.percent {
            color: #e74c3c;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .history-table th {
            background: #f5f5f5;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #ddd;
        }

        .history-table td {
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
        }

        .history-table tr:hover {
            background: #f9f9f9;
        }

        .btn-delete {
            background: #e74c3c;
            color: white;
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .btn-delete:hover {
            background: #c0392b;
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: #999;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 Donation Tracker</h1>

        <div class="card">
            <div class="success-message" id="successMsg">Entry saved successfully!</div>

            <h2 style="margin-bottom: 20px; color: #333;">Enter Cashier Data</h2>

            <div class="input-row">
                <div class="form-group">
                    <label for="cashierName">Cashier Name</label>
                    <input type="text" id="cashierName" placeholder="e.g., Sarah">
                </div>
            </div>

            <div class="input-row">
                <div class="form-group">
                    <label for="dateStart">Start Date</label>
                    <input type="date" id="dateStart">
                </div>
                <div class="form-group">
                    <label for="dateEnd">End Date</label>
                    <input type="date" id="dateEnd">
                </div>
            </div>

            <div class="input-row">
                <div class="form-group">
                    <label for="totalTransactions">Total Transactions</label>
                    <input type="number" id="totalTransactions" placeholder="e.g., 247" min="0">
                </div>
                <div class="form-group">
                    <label for="totalDonationAmount">Total Donation Amount ($)</label>
                    <input type="number" id="totalDonationAmount" placeholder="e.g., 62.50" min="0" step="0.01">
                </div>
            </div>

            <div class="form-group">
                <label for="donationTransactions">Number of Transactions with Donations</label>
                <input type="number" id="donationTransactions" placeholder="e.g., 18" min="0">
            </div>
